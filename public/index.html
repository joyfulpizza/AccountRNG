<!DOCTYPE html>
<html>
<head>
<title>Roblox UserID Roller</title>
<style>
body {
    background: #111;
    color: white;
    font-family: Arial;
    text-align: center;
    margin-top: 60px;
}

button {
    padding: 15px 40px;
    font-size: 20px;
    cursor: pointer;
}

#card {
    margin-top: 40px;
}

img {
    width: 150px;
    height: 150px;
    border-radius: 10px;
}

#rarity {
    font-size: 22px;
    margin-top: 10px;
}
</style>
</head>
<body>

<h1>🎲 Roblox UserID Roller</h1>
<button onclick="roll()">ROLL</button>

<div id="card"></div>

<script>
async function roll() {
    const res = await fetch("/roll");
    const data = await res.json();

    document.getElementById("card").innerHTML = `
        <h2>ROLLED:</h2>
        <img src="${data.avatar}">
        <h3>#${data.id} ${data.name}</h3>
        <div id="rarity" style="color:${data.color}">
            ${data.rarity}
        </div>
    `;
}
</script>

</body>
</html>
